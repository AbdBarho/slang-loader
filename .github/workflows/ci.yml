name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci

      - id: wasm
        uses: actions/cache@v6
        with:
          path: vendor
          key: slang-wasm-${{ hashFiles('src/compiler/version.ts') }}
      - if: steps.wasm.outputs.cache-hit != 'true'
        run: npm run fetch-wasm

      # Before the tests, so test/dist.test.ts runs instead of skipping itself.
      - run: npm run build
      - run: npm test
